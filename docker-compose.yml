version: '3.8'

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-odev_portal}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    environment:
      DB_HOST: mysql
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:-root}
      DB_NAME: ${DB_NAME:-odev_portal}
      JWT_SECRET: ${JWT_SECRET:-secret-key-change-in-production}
      PORT: 5002
    ports:
      - "5002:5002"
    depends_on:
      - mysql

  frontend:
    build:
      context: ./frontend
    environment:
      REACT_APP_API_URL: http://localhost:5002
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mysql_data:
